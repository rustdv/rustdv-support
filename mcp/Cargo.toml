[package]
name = "rustdv-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Simulator-neutral MCP debugging for RustDV with optional recording backends"
readme = "README.md"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.1.3", features = ["transport-streamable-http-server"] }
rustdv.workspace = true
rustdv-debug.workspace = true
rustdv-mcp-fst.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-util = "0.7"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
