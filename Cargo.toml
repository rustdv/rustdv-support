[workspace]
resolver = "2"
members = [
    "debug",
    "mcp-verilator",
    "tests/debug-control-verilator/rustdv",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustdv/rustdv-support"

[workspace.dependencies]
# Temporary exact pin while the required RustDV core API is under review.
# Replace this with a released RustDV version once that API is tagged.
rustdv = { git = "https://github.com/teabone113/rustdv.git", rev = "946c19ea0f03921880e9b216e7cde64719d09803" }
rustdv-debug = { path = "debug" }
rustdv-mcp-verilator = { path = "mcp-verilator" }
rustdv-vpi-stubs = { git = "https://github.com/teabone113/rustdv.git", rev = "946c19ea0f03921880e9b216e7cde64719d09803" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
