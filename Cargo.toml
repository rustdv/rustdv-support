[workspace]
resolver = "2"
members = [
    "debug",
    "mcp",
    "mcp-fst",
    "mcp-verilator",
    "tests/debug-control-verilator/rustdv",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustdv/rustdv-support"

[workspace.dependencies]
# Temporary exact pin while the required RustDV core API is under review.
# Replace this with a released RustDV version once that API is tagged.
rustdv = { git = "https://github.com/teabone113/rustdv.git", rev = "259490f6aa659c6016795296d3740def24fdfce3", package = "rustdv" }
rustdv-debug = { path = "debug" }
rustdv-mcp = { path = "mcp" }
rustdv-mcp-fst = { path = "mcp-fst" }
rustdv-mcp-verilator = { path = "mcp-verilator" }
rustdv-vpi-stubs = { git = "https://github.com/teabone113/rustdv.git", rev = "259490f6aa659c6016795296d3740def24fdfce3", package = "rustdv-vpi-stubs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
