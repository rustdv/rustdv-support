[package]
name = "rustdv-mcp-verilator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP control, live inspection, and FST history for RustDV Verilator simulations"
readme = "README.md"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
fst-reader = "0.17.0"
rmcp = { version = "3.1.3", features = ["transport-streamable-http-server"] }
rustdv.workspace = true
rustdv-debug.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-util = "0.7"
tempfile = "3"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
